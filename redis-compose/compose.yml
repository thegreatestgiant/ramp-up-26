---
services:
  redis:
    image: redis:latest
    container_name: my-redis
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    restart: unless-stopped
    networks:
      - pubsub_net

  publisher:
    image: thegreatestgiant/pub:latest
    container_name: pub
    depends_on:
      - redis
    networks:
      - pubsub_net
    ports:
      - 8080:8000

  subscriber:
    image: thegreatestgiant/sub:latest
    container_name: sub
    depends_on:
      - publisher
    networks:
      - pubsub_net

volumes:
  redis-data:
    driver: local

networks:
  pubsub_net:
